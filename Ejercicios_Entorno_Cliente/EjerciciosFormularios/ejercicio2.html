<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea name="txt" id="txt" placeholder="Ponga texto aqui"></textarea>
    <p id="parrafo"></p>
    <script>

        
        var texto = document.getElementById("txt");
        var parrafo = document.getElementById("parrafo");
        let contador= 0;
        var limite = 100

        
        texto.addEventListener('keyup', function(){
            if(texto.value.length !== contador){
                contador = texto.value.length
            }
            parrafo.innerHTML= `caracteres actuales: ${contador} | limite: ${limite}`;
        });
        
        
        texto.addEventListener('keydown', function(evento){
            caracteresactuales= texto.value.length;

            if(evento.keyCode === 8){
                
            }

            if(evento.keyCode === 46){
                
            }

            if(evento.keyCode === 37){
                console.log("Se ha movido la flecha izquierda");
            }

            if(evento.keyCode === 39){
                console.log("Se ha movido la flecha derecha");
            }


            let teclaspermitidas= [8,46,37,39];
            let teclasdeborrado=[8,46]
            if (caracteresactuales >= limite){
                alert("Has llegado al limite");
                if(teclasdeborrado.includes(evento.keyCode)) {
                    if (contador > 0){
                        contador--
                    }     
                }
                if(!teclaspermitidas.includes(evento.keyCode)) {
                    contador++
                    evento.preventDefault(); // Aqui lo que hace es bloquear la tecla que no esta en las que he permitido
                }
            }
        });
    </script>
</body>
</html>
