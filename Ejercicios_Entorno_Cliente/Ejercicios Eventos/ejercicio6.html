<!DOCTYPE html>
<html>
<head>
    <title>Control de Velocidad</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        #v {
            font-size: 3em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="v">Velocidad 0</div>

    <script>
        let x = 0;
        const display = document.getElementById('v');

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                x++;
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                x--;
                e.preventDefault();
            }
            display.textContent = `Velocidad ${x}`;
        });
    </script>
</body>
</html>
